# 프로젝트 전용 Redis 설정 (개발용)
# 실행: "C:\Program Files\Redis\redis-server.exe" redis\redis-6780.conf  (server 폴더에서 실행)

# 포트 — CLAUDE.md 기술 스택 기준
port 6780

# 외부 접속 차단 (내 PC 에서만 접속)
bind 127.0.0.1

# 데이터 파일 저장 위치 (server 폴더 기준 상대 경로)
dir ./redis/data
dbfilename dump-6780.rdb

# 개발용이라 메모리 사용량을 작게 제한 (Redis 3.0.504 는 maxheap 설정을 지원하지 않음)
maxmemory 128mb

# 로그 — dir 설정 이후의 상대 경로는 dir(./redis/data) 기준으로 해석된다
loglevel notice
logfile redis-6780.log
